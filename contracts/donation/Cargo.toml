[package]
name = "soundfaith-donation"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cosmwasm-schema = "1.5"
cosmwasm-std = { version = "1.5", features = ["iterator", "staking"] }
cw-storage-plus = "1.1"
cw2 = "1.1"
serde = { version = "1.0", features = ["derive"] }
schemars = "0.8"
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
